[package]
name = "goose-agent"
version = "0.1.0-alpha.13"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The GDK's Agent Loop"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync", "rt", "time"] }
tokio-util = { workspace = true, features = ["compat"] }
async-trait = { workspace = true }
goose-provider-types = { version = "0.1.0-alpha.13", path = "../goose-provider-types", default-features = false }
rmcp = { workspace = true, features = ["server"] }
uuid = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-futures = { workspace = true }
serde.workspace = true
regex = { workspace = true, features = ["unicode-perl"] }
goose-sdk-types = { version = "0.1.0-alpha.13", path = "../goose-sdk-types", default-features = false }
minijinja = { version = "2.18", default-features = false, features = ["loader", "multi_template", "serde", "builtins"], optional = true }
indexmap = { version = "2.9", default-features = false, features = ["serde", "std"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
thiserror = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rmcp = { workspace = true, features = ["local"] }

[dev-dependencies]
schemars.workspace = true
test-case.workspace = true

[features]
mcp = ["tokio/io-util", "tokio/net", "tokio/process", "dep:reqwest", "dep:thiserror", "rmcp/client", "rmcp/transport-child-process", "rmcp/transport-streamable-http-client-reqwest", "rmcp/auth"]
context-management = ["dep:goose-context-management"]
permissions = ["dep:fs2", "dep:tempfile"]
tool-output = ["dep:tempfile"]
project-context = ["dep:ignore", "dep:shell-words", "dep:libc"]
prompt = ["dep:minijinja", "dep:indexmap"]

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
js-sys = "0.3.105"
wasm-bindgen-futures = "0.4.78"
wasm-bindgen-test = "0.3.78"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ignore = { workspace = true, optional = true }
shell-words = { workspace = true, optional = true }
fs2 = { workspace = true, optional = true }
goose-context-management = { version = "0.1.0-alpha.13", path = "../goose-context-management", optional = true }
serde_yaml.workspace = true
tempfile = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile.workspace = true

[target."cfg(unix)".dependencies]
libc = { version = "0.2.182", optional = true }
