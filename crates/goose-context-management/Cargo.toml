[package]
name = "goose-context-management"
version = "0.1.0-alpha.13"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Conversation compaction for Goose"

[lints]
workspace = true

[features]
default = []
token-counter = ["dep:tiktoken-rs", "dep:lru", "dep:blake3", "dep:tokio"]
rustls-tls = []
native-tls = []

[dependencies]
goose-provider-types = { version = "0.1.0-alpha.13", path = "../goose-provider-types", default-features = false }
anyhow = { workspace = true }
async-trait = { workspace = true }
include_dir = { workspace = true }
minijinja = { version = "2.18", default-features = false, features = ["loader", "multi_template", "serde"] }
rmcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
tracing = { workspace = true }
tiktoken-rs = { version = "0.12", default-features = false, optional = true }
lru = { workspace = true, optional = true }
blake3 = { version = "1", default-features = false, features = ["std"], optional = true }
tokio = { workspace = true, features = ["sync"], optional = true }

[dev-dependencies]
futures.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
